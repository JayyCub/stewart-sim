<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='5' width='24' height='4' rx='1' fill='%232457c5'/%3E%3Cpath d='M8 9 5 26M13 9l-3 17M19 9l3 17M24 9l3 17' stroke='%23586371' stroke-width='2'/%3E%3Crect x='2' y='25' width='28' height='4' rx='1' fill='%23c8a878'/%3E%3C/svg%3E" />
    <title>Stewart Platform Sim</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <style>
      /* Layout: instrument bench. Live 3D rig fills the left; a scrolling control rail on the right stacks under it on phones. */
      :root {
        --bg: #e8ebee;
        --panel: #f6f7f8;
        --viewport: #dde2e6;
        --ink: #1a2027;
        --muted: #586371;
        --line: #d0d7de;
        --accent: #2457c5;
        --accent-ink: #ffffff;
        --track: #d3dae1;
        --reach: #a9bfea;
        --good: #26703f;
        --good-bg: #dcefe2;
        --bad: #b42f27;
        --bad-bg: #f7dfdc;
        --warn: #d99a2b;
        --clash: #8a4fbf;
        --series-1: #2a78d6;
        --series-2: #eb6834;
        --sky: #5b8fc7;
        --ground: #8a6a45;
        --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-label: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
        --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #101418;
          --panel: #161b21;
          --viewport: #0c1014;
          --ink: #e3e7eb;
          --muted: #93a0ad;
          --line: #29313a;
          --accent: #7ea3ff;
          --accent-ink: #0c1322;
          --track: #29313a;
          --reach: #34508c;
          --good: #74c792;
          --good-bg: #17301f;
          --bad: #ff8d84;
          --bad-bg: #3b1c19;
          --warn: #a8761c;
          --clash: #9a6fd0;
        --series-1: #3987e5;
        --series-2: #d95926;
        --sky: #3d6a9c;
        --ground: #6b5236;
          --series-1: #3987e5;
          --series-2: #d95926;
          --sky: #3d6a9c;
          --ground: #6b5236;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #101418;
        --panel: #161b21;
        --viewport: #0c1014;
        --ink: #e3e7eb;
        --muted: #93a0ad;
        --line: #29313a;
        --accent: #7ea3ff;
        --accent-ink: #0c1322;
        --track: #29313a;
        --reach: #34508c;
        --good: #74c792;
        --good-bg: #17301f;
        --bad: #ff8d84;
        --bad-bg: #3b1c19;
        --warn: #a8761c;
        --clash: #9a6fd0;
        color-scheme: dark;
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.45 var(--font-body);
      }
      #root { height: 100%; }
      .app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }

      .topbar {
        display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
        padding-block: 12px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      .brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; min-width: 0; }
      h1 { margin: 0; font: 600 19px/1.2 var(--font-label); letter-spacing: 0.01em; text-wrap: balance; }
      .meta { color: var(--muted); font: 12px var(--font-data); }
      .status {
        font: 500 13px var(--font-label); letter-spacing: 0.02em;
        padding: 4px 10px; border-radius: 4px; border: 1px solid currentColor;
      }
      .status.good { color: var(--good); background: var(--good-bg); }
      .status.bad { color: var(--bad); background: var(--bad-bg); }

      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 384px; min-height: 0; }
      .viewport { position: relative; background: var(--viewport); min-height: 0; }
      .viewport canvas { display: block; }
      .viewport-note {
        position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px;
        color: var(--muted); font: 11px var(--font-data); pointer-events: none;
      }
      .leg-tag {
        display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
        background: var(--panel); color: var(--ink); border: 1px solid var(--line);
        font: 600 11px var(--font-data); user-select: none;
      }
      .leg-tag.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }

      .controls {
        overflow-y: auto; min-height: 0; background: var(--panel); border-left: 1px solid var(--line);
        padding-block: 8px 24px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        display: flex; flex-direction: column; gap: 4px;
      }
      .notice {
        margin: 8px 0 4px; padding: 10px 12px; border-radius: 4px;
        background: var(--bg); border: 1px dashed var(--muted); color: var(--ink); font-size: 13px;
      }
      code { font: 12.5px var(--font-data); }
      .panel-section { padding-block: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
      .panel-section > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      h2 {
        margin: 0; font: 600 12px var(--font-label); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted);
      }
      .readout { font: 12px var(--font-data); color: var(--ink); font-variant-numeric: tabular-nums; }
      .hint { margin: 0; color: var(--muted); font-size: 12.5px; }

      .slider { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; }
      .slider label { font-size: 13px; }
      .slider output { font: 500 13px var(--font-data); font-variant-numeric: tabular-nums; }
      .slider output.over { color: var(--bad); }
      .unit { color: var(--muted); margin-left: 2px; }
      .slider input { grid-column: 1 / -1; }

      input[type="range"] {
        -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 6px 0;
        background: var(--track); border-radius: 3px; cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%;
        background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--accent);
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel);
      }
      input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; font: 500 11.5px var(--font-label); letter-spacing: 0.04em; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); }
      td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
      td, .num { font-variant-numeric: tabular-nums; }
      td.num, th.num { text-align: right; font-family: var(--font-data); white-space: nowrap; }
      tbody tr:last-child td { border-bottom: 0; }
      .chip { display: inline-block; margin: 0 4px 2px 0; padding: 1px 7px; border-radius: 3px; font: 500 11.5px var(--font-label); letter-spacing: 0.02em; white-space: nowrap; }
      .chip.ok { color: var(--good); background: var(--good-bg); }
      .chip.bad { color: var(--bad); background: var(--bad-bg); }

      .actions { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 16px 4px; }
      button {
        font: 500 13px var(--font-body); padding: 7px 14px; border-radius: 4px; cursor: pointer;
        border: 1px solid var(--line); background: transparent; color: var(--ink);
      }
      button:hover { border-color: var(--muted); }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      button.ghost { padding: 4px 10px; font-size: 12.5px; }
      .tiltmap-plot { display: grid; grid-template-columns: auto 26px minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 4px; max-width: 320px; margin: 4px auto 0; }
      .tiltmap-ylabel { grid-row: 1; grid-column: 1; writing-mode: vertical-rl; transform: rotate(180deg); align-self: center; font: 11px var(--font-label); color: var(--muted); }
      .tiltmap-yticks { grid-row: 1; grid-column: 2; position: relative; }
      .tiltmap-yticks span { position: absolute; right: 0; transform: translateY(50%); font: 10.5px var(--font-data); color: var(--muted); }
      .tiltmap-frame { grid-row: 1; grid-column: 3; position: relative; aspect-ratio: 1; border: 1px solid var(--line); }
      .tiltmap-frame canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
      .tiltmap-axis { position: absolute; background: var(--ink); opacity: 0.25; pointer-events: none; }
      .tiltmap-axis.v { top: 0; bottom: 0; width: 1px; }
      .tiltmap-axis.h { left: 0; right: 0; height: 1px; }
      .tiltmap-marker { position: absolute; width: 10px; height: 10px; margin: 0 0 -7px -7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); pointer-events: none; }
      .tiltmap-marker.bad { background: var(--bad); }
      .tiltmap-xticks { grid-row: 2; grid-column: 3; position: relative; height: 16px; }
      .tiltmap-xticks span { position: absolute; top: 2px; transform: translateX(-50%); font: 10.5px var(--font-data); color: var(--muted); }
      .tiltmap-xlabel { grid-row: 3; grid-column: 3; text-align: center; font: 11px var(--font-label); color: var(--muted); }
      .tiltmap-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; margin: 10px 0 6px; padding: 0; list-style: none; font-size: 12px; color: var(--muted); }
      .tiltmap-legend .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border: 1px solid var(--line); vertical-align: -1px; }
      .sweep-grid { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 62px); gap: 6px 6px; align-items: center; margin-top: 10px; }
      .sweep-row { display: contents; }
      .sweep-head { font: 11px var(--font-label); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .sweep-head.num { text-align: right; }
      .sweep-name { display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; }
      .sweep-name .unit { color: var(--muted); font-size: 11.5px; }
      .sweep-grid input[type="number"] { width: 100%; box-sizing: border-box; padding: 3px 5px; text-align: right; font: 12px var(--font-data); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
      .sweep-fixed { grid-column: span 3; text-align: right; font: 12px var(--font-data); color: var(--muted); }
      .sweep .actions { align-items: center; padding-block: 12px 6px; }
      .sweep-progress { width: 100%; height: 6px; accent-color: var(--accent); }
      .sweep-results tr.current td { background: var(--good-bg); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .paper { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-size: 13px; }
      .paper select { font: inherit; padding: 3px 6px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
      .template-table td { vertical-align: middle; }
      .template-table .sub { display: block; font: 11.5px var(--font-data); color: var(--muted); }
      .subhead { margin: 14px 0 2px; font: 600 11.5px var(--font-label); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .load-error { margin: 8px 0 0; padding: 8px 10px; white-space: pre-wrap; font: 12px var(--font-data); color: var(--bad); background: var(--bad-bg); border: 1px solid var(--bad); border-radius: 4px; }
      .paste-box .actions { padding-block: 8px 0; }
      .json-fallback { width: 100%; box-sizing: border-box; font: 12px var(--font-data); background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }

      .hw { display: flex; flex-direction: column; gap: 10px; }
      .hw-state { display: flex; align-items: center; gap: 8px; font: 500 13px var(--font-label); letter-spacing: 0.02em; }
      .hw-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
      .hw-dot.unknown, .hw-dot.connecting, .hw-dot.busy { background: var(--warn); }
      .hw-dot.held { background: var(--accent); }
      .hw-dot.live { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
      .notice.warn { margin: 0; border-style: solid; border-color: var(--warn); }
      .actions.tight { padding-block: 0; }
      button.stop {
        width: 100%; padding: 12px 14px; font: 600 15px var(--font-label); letter-spacing: 0.04em; text-transform: uppercase;
        background: var(--bad); color: var(--panel); border-color: var(--bad);
      }
      button.stop kbd { margin-left: 8px; padding: 1px 6px; border: 1px solid currentColor; border-radius: 3px; font: 500 11px var(--font-data); opacity: 0.85; }
      .hw-pose { display: flex; flex-wrap: wrap; gap: 2px 10px; }
      .hw-pose span:first-child { color: var(--muted); }
      .hw-stats { color: var(--muted); }
      .hw-warn { margin: 0; padding: 6px 10px; border-left: 3px solid var(--warn); background: var(--bg); font-size: 12.5px; }
      .hw-error { margin: 0; padding: 6px 10px; border-left: 3px solid var(--bad); background: var(--bad-bg); color: var(--bad); font-size: 12.5px; }
      .jog-sliders { display: flex; flex-direction: column; gap: 2px; }
      .jog-row { padding: 4px 8px; margin-inline: -8px; border-left: 3px solid transparent; border-radius: 3px; }
      .jog-row.on { border-left-color: var(--accent); background: var(--bg); }
      .jog-row label .chip { margin: 0 0 0 6px; }
      .jog-check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
      .jog-check input { margin-top: 3px; }
      .jog-select, .jog-note, .jog-margins input {
        font: inherit; font-size: 13px; padding: 5px 7px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; box-sizing: border-box;
      }
      .jog-select, .jog-note { width: 100%; }
      .jog-margins { display: flex; gap: 14px; font-size: 13px; }
      .jog-margins label { display: flex; align-items: center; gap: 6px; }
      .jog-margins input { width: 64px; text-align: right; font-family: var(--font-data); }
      table .sub { display: block; font-size: 11.5px; color: var(--muted); }
      table .sub.warn-text { color: var(--warn); }
      td.sub-cell { font-size: 12px; color: var(--muted); }
      button.icon { padding: 0 8px; font-size: 15px; line-height: 1.4; }

      .toast {
        position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px);
        background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 4px; font-size: 13px;
        opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s; max-width: calc(100% - 32px);
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      @media (max-width: 860px) {
        html, body, #root, .app { height: auto; }
        .layout { grid-template-columns: minmax(0, 1fr); }
        .viewport { height: 58svh; min-height: 300px; }
        .controls { border-left: 0; overflow: visible; }
      }
      @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
      .flight { display: flex; flex-direction: column; gap: 10px; }
      .flight-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
      .flight-row select { font: inherit; padding: 3px 6px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; }
      #flight-turb { text-transform: capitalize; }
      .flight-actions { align-items: center; padding-block: 0; }
      .flight-instruments { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; }
      .attitude { width: 96px; height: 96px; display: block; border-radius: 50%; border: 1px solid var(--line); }
      .flight-readouts { display: grid; grid-template-columns: auto auto; gap: 3px 10px; margin: 0; font-size: 12.5px; }
      .flight-readouts dt { color: var(--muted); }
      .flight-readouts dd { margin: 0; text-align: right; font: 12.5px var(--font-data); font-variant-numeric: tabular-nums; }
      .flight-limit { margin: 0; font: 12px var(--font-data); color: var(--muted); }
      .flight-limit.clipped { color: var(--ink); }
      .cue-chart { margin: 0; }
      .cue-chart figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; font-size: 12.5px; margin-bottom: 3px; }
      .cue-title { font-weight: 500; }
      .cue-legend { display: flex; gap: 12px; color: var(--muted); font-size: 12px; }
      .cue-legend b { font: 500 12px var(--font-data); color: var(--ink); font-variant-numeric: tabular-nums; }
      .cue-swatch { display: inline-block; width: 12px; height: 2px; margin-right: 5px; vertical-align: 3px; border-radius: 1px; }
      .cue-swatch.s1 { background: var(--series-1); }
      .cue-swatch.s2 { background: var(--series-2); }
      .cue-plot { position: relative; padding-left: 30px; }
      .cue-plot canvas { display: block; width: 100%; height: 72px; border: 1px solid var(--line); border-radius: 3px; touch-action: none; cursor: crosshair; }
      .cue-tick { position: absolute; left: 0; width: 26px; text-align: right; font: 10px var(--font-data); color: var(--muted); }
      .cue-tick.top { top: 0; }
      .cue-tick.bottom { bottom: 0; }
      .cue-time { position: absolute; top: -2px; transform: translateX(calc(30px - 50%)); padding: 0 4px; font: 10.5px var(--font-data); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 3px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
